[package]
name = "local-ai"
version = "0.1.0"
edition = "2021"
description = "Motore AI locale per la conversione offline dei mod (client HTTP OpenAI-compatible verso un server locale)"
license-file = "../../LICENSE"
publish = false

[dependencies]
bridge-u8 = { path = "../bridge-u8" }
# Client HTTP verso un server OpenAI-compatible locale (llama-server, LM Studio,
# Ollama, ...). `rustls-tls` usa ring: nessuna build C++/cmake, nessun bindgen.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[features]
default = []
