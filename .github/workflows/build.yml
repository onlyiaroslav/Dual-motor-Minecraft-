name: Build Doge Client APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          sdkmanager --list_installed | head -40

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          cargo ndk --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Debug APK
        run: |
          set +e
          (
            set -e
            chmod +x gradlew

            # NDK/SDK calcolati nella shell, non con espressioni che possono
            # risultare vuote.
            SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
            export ANDROID_HOME="$SDK_HOME"
            export ANDROID_SDK_ROOT="$SDK_HOME"
            export ANDROID_NDK_HOME="$SDK_HOME/ndk/27.0.12077973"
            export PATH="$SDK_HOME/cmake/3.22.1/bin:$PATH"

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            ls -la "$SDK_HOME/ndk" 2>&1 || true
            java -version
            cargo ndk --version
            ./gradlew --version

            ./gradlew :starling:assembleDebug --stacktrace --no-daemon
          ) 2>&1 | tee /tmp/gradle-build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code"
          exit $code

      - name: Write build log to run summary
        if: always()
        run: |
          {
            echo '<details><summary>Gradle output</summary>'
            echo '```text'
            if [ -f /tmp/gradle-build.log ]; then
              tail -240 /tmp/gradle-build.log
            else
              echo "(nessun log: lo step è fallito prima di creare il file)"
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doge-client-debug-apk
          path: starling/build/outputs/apk/debug/*.apk
          retention-days: 30
