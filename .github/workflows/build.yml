name: Build Doge Client APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Controllo statico rapido (<1s): intercetta import mancanti, delegate
      # senza getValue/setValue, commenti nidificati, parentesi sbilanciate e
      # API Java non disponibili su Android PRIMA di spendere minuti di build.
      - name: Verifica statica sorgenti Kotlin
        run: python3 scripts/check-kotlin.py .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Solo cmdline-tools: i pacchetti veri si installano sotto, con licenze
      # accettate e retry (l'input "packages" dell'action falliva in CI).
      # continue-on-error: se l'action è flaky, lo step successivo si arrangia
      # con l'SDK preinstallato nell'immagine del runner.
      - name: Set up Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK"

          # sdkmanager: PATH dell'action, SDK preinstallato, o download ufficiale.
          if ! command -v sdkmanager > /dev/null 2>&1; then
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
            else
              echo "sdkmanager assente: scarico cmdline-tools"
              curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              rm -rf "$SDK/cmdline-tools/latest"
              mkdir -p "$SDK/cmdline-tools"
              unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
              export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
            fi
          fi

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true

          # 3 tentativi: i download da dl.google.com ogni tanto vanno in timeout.
          for attempt in 1 2 3; do
            echo "sdkmanager --install (tentativo $attempt)"
            if sdkmanager --install \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "ndk;27.0.12077973" \
              "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          sdkmanager --list_installed | head -40 || true

      # wgpu 30.0.1 (crates/starling-render) richiede Rust >= 1.87 e la build
      # Android e' verificata con 1.90: niente "stable" flottante.
      - name: Set up Rust 1.90 and Android target
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
          cargo ndk --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Debug APK
        id: buildapk
        run: |
          set +e
          (
            set -e
            chmod +x gradlew

            # NDK/SDK calcolati nella shell, non con espressioni che possono
            # risultare vuote.
            SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
            export ANDROID_HOME="$SDK_HOME"
            export ANDROID_SDK_ROOT="$SDK_HOME"
            export ANDROID_NDK_HOME="$SDK_HOME/ndk/27.0.12077973"
            export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
            export ANDROID_NDK="$ANDROID_NDK_HOME"
            export PATH="$SDK_HOME/cmake/3.22.1/bin:$PATH"

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            ls -la "$SDK_HOME/ndk" 2>&1 || true
            java -version
            cargo ndk --version
            ./gradlew --version

            ./gradlew :starling:assembleDebug --stacktrace --no-daemon
          ) 2>&1 | tee /tmp/gradle-build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code"
          exit $code

      # Diagnostica non bloccante: dice QUALI .so finiscono nell'APK e quali
      # dipendenze ELF hanno. Serve a capire perché System.loadLibrary fallisce.
      - name: Diagnostica librerie native
        if: always()
        run: |
          set +e
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          {
            echo ""
            echo "===== DIAGNOSTICA LIBRERIE NATIVE ====="
            echo "--- jniLibs (cargo-ndk) ---"
            ls -la starling/src/main/jniLibs/arm64-v8a/ 2>&1
            echo "--- .so da CMake ---"
            find starling/build -name '*.so' 2>/dev/null | head -20
            APK=$(ls starling/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
            echo "--- APK: ${APK:-nessuno} ---"
            if [ -n "$APK" ]; then
              unzip -l "$APK" | grep -E '\.so' || echo "NESSUNA .so NELL'APK"
            fi
            echo "--- dipendenze ELF (DT_NEEDED / SONAME) ---"
            READELF=$(ls "$SDK_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null | head -1)
            for so in starling/src/main/jniLibs/arm64-v8a/*.so $(find starling/build -name 'libstarling_jvm_host.so' 2>/dev/null | head -1); do
              [ -f "$so" ] || continue
              echo "## $so"
              if [ -n "$READELF" ]; then
                "$READELF" -d "$so" 2>&1 | grep -E 'NEEDED|SONAME' || true
              fi
            done
            echo "===== FINE DIAGNOSTICA ====="
          } >> /tmp/gradle-build.log 2>&1
          tail -50 /tmp/gradle-build.log
          exit 0

      - name: Write build log to run summary
        if: always()
        run: |
          set +e
          {
            echo '<details><summary>Gradle output</summary>'
            echo '```text'
            if [ -f /tmp/gradle-build.log ]; then
              tail -240 /tmp/gradle-build.log
            else
              echo "(nessun log: lo step è fallito prima di creare il file)"
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotazioni pubbliche (limitate a 4096 caratteri). Mai fallire qui:
          # sono solo diagnostica, non devono marcare il run come failure.
          if [ -f /tmp/gradle-build.log ]; then
            cp /tmp/gradle-build.log "$GITHUB_WORKSPACE/gradle-build.log"
            sed 's/\x1b\[[0-9;]*m//g' /tmp/gradle-build.log > /tmp/gradle-clean.log
            enc() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g'; }
            head -c 3500 /tmp/gradle-clean.log | enc | { read -r m; echo "::notice title=Gradle log (inizio)::$m"; } || true
            tail -c 3500 /tmp/gradle-clean.log | enc | { read -r m; echo "::notice title=Gradle log (fine)::$m"; } || true
            grep -nE "error(\[E[0-9]+\])?:|FAILED|What went wrong|Caused by|panicked|Execution failed" /tmp/gradle-clean.log | head -40 | enc | { read -r m; echo "::error title=Gradle errori rilevati::$m"; } || true
          fi
          exit 0

      - name: Publish full build log to ci-logs branch
        if: always()
        run: |
          if [ -f /tmp/gradle-build.log ]; then
            mkdir -p ci-logs
            sed 's/\x1b\[[0-9;]*m//g' /tmp/gradle-build.log > "ci-logs/build-${GITHUB_RUN_ID}.log"
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add ci-logs
            git commit -m "ci: build log [skip ci]" || true
            git push origin HEAD:refs/heads/ci-logs --force || true
          fi

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        if: steps.buildapk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: doge-client-debug-apk
          path: starling/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Gli artifact di Actions sono SEMPRE zip che contiene l'APK. Qui l'APK
      # viene pubblicato anche come asset di Release: si scarica il file .apk
      # diretto, senza zip da estrarre.
      - name: APK diretto (Release, senza zip)
        if: steps.buildapk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls starling/build/outputs/apk/debug/*.apk | head -1)
          TAG="latest-debug"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"

          REL_ID=$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id') or '')")

          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Doge Client — APK debug\",\"prerelease\":true,\"body\":\"APK debug scaricabile direttamente (nessuno zip).\"}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi

          # Rimuove l'asset precedente con lo stesso nome (evita 422).
          curl -sS -H "$AUTH" "$API/releases/$REL_ID/assets" \
            | python3 -c "
          import json,sys
          for a in json.load(sys.stdin):
              if a['name'] == 'doge-client-debug.apk':
                  print(a['id'])
          " | while read -r AID; do
            [ -n "$AID" ] && curl -sS -X DELETE -H "$AUTH" "$API/releases/assets/$AID" || true
          done

          URL=$(curl -sS -X POST -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?name=doge-client-debug.apk" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('browser_download_url',''))")

          echo "APK diretto: $URL"
          {
            echo "### APK scaricabile direttamente"
            echo ""
            echo "[$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
